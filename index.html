<style>
:root{--bg:#fbf8f3;--ink:#3a2a33;--sage:#6f8468;--blush:#e7c9c2;--gold:#b08d57;--card:#fff;--f:'Cormorant Garamond',Georgia,serif;--s:'Jost',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a20;--ink:#f1e8e2;--sage:#a3b59c;--blush:#8a6a70;--gold:#d2ae75;--card:#2f2229}}
:root[data-theme="dark"]{--bg:#241a20;--ink:#f1e8e2;--sage:#a3b59c;--blush:#8a6a70;--gold:#d2ae75;--card:#2f2229}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:300 1.05rem/1.75 var(--s);text-align:center;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f);font-weight:300;line-height:1.05}
h2{font-size:clamp(2.4rem,10vw,3.4rem);font-style:italic;margin-bottom:.4rem}
.orn{display:flex;align-items:center;justify-content:center;gap:.8rem;color:var(--gold);margin:0 0 1.8rem}
.orn::before,.orn::after{content:"";width:46px;height:1px;background:currentColor}
.orn i{width:7px;height:7px;rotate:45deg;border:1px solid currentColor}
section{padding:5rem 1.5rem;max-width:640px;margin:auto}
/* Fleurs */
.bl{fill:var(--blush);fill-opacity:.75}.bl.g{fill:var(--gold);fill-opacity:1}
.lf{fill:var(--sage);fill-opacity:.55}.st{fill:none;stroke:var(--sage);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.corner{position:absolute;width:min(62vw,300px);color:var(--sage);transform-origin:0 0;animation:sway 9s ease-in-out infinite}
.corner.tl{top:0;left:0}.corner.br{bottom:0;right:0;rotate:180deg;animation-direction:reverse}
@keyframes sway{50%{scale:1.025}}
.sep{width:84px;height:84px;display:block;margin:0 auto 1rem}
/* Bienvenue */
#w{position:fixed;inset:0;z-index:10;background:var(--bg);display:grid;place-content:center;gap:1.2rem;padding:2rem;overflow:hidden;clip-path:circle(150% at 50% 62%);transition:clip-path 1.4s cubic-bezier(.7,0,.2,1)}
#w.out{clip-path:circle(0% at 50% 62%);pointer-events:none}
#w>.c{position:relative;display:grid;gap:1.1rem;justify-items:center}
#w .c>*{animation:up 1.4s both}#w .c>:nth-child(2){animation-delay:.5s}#w .c>:nth-child(3){animation-delay:.8s}#w .c>:nth-child(4){animation-delay:1.1s}#w .c>:nth-child(5){animation-delay:1.5s}
@keyframes up{from{opacity:0;translate:0 14px}}
.mono{font:italic 300 2.6rem var(--f);color:var(--gold);letter-spacing:.1em}
#w h1{font-size:clamp(3.2rem,15vw,5rem);font-style:italic}#w p{max-width:21rem}
.btn{font:400 .85rem var(--s);letter-spacing:.18em;text-transform:uppercase;color:var(--ink);background:none;border:1px solid var(--gold);border-radius:999px;padding:1rem 2.2rem;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;transition:color .4s,transform .3s}
.btn::before{content:"";position:absolute;inset:0;background:var(--gold);translate:-101% 0;transition:translate .5s;z-index:-1}
.btn:hover,.btn:focus-visible{color:#fff}.btn:hover::before,.btn:focus-visible::before{translate:0}.btn:active{transform:scale(.97)}
.pulse{animation:up 1.4s 1.5s both,glow 3.2s 3s infinite}
@keyframes glow{50%{box-shadow:0 0 0 9px #b08d5722}}
:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
/* Hero */
.hero{min-height:100svh;display:grid;align-content:center;gap:1rem;padding:4rem 1.5rem 2rem;max-width:640px;margin:auto}
.hero h1{font-size:clamp(3rem,15vw,4.8rem);letter-spacing:.03em}
.hero h1 span{display:inline-block;opacity:0}.go .hero h1 span{animation:letter 1s both}
@keyframes letter{from{opacity:0;translate:0 .4em;filter:blur(6px)}to{opacity:1}}
.hero>*:not(h1){opacity:0}.go .hero>*:not(h1){animation:up 1.2s 1.6s both}.go .hero>.ph-w{animation-delay:2.1s}.go .hero>.scroll{animation-delay:2.8s}
.guest b{display:block;font:italic 300 clamp(2.4rem,11vw,3.4rem)/1.1 var(--f)}
.guest small{display:block;margin-top:.5rem;font:400 .8rem var(--s);letter-spacing:.32em;color:var(--sage);text-transform:uppercase}
.ph{background:var(--i,none) center/cover,linear-gradient(160deg,#efe3d9,#e0c3bb 70%,#cfaea5);display:grid;place-content:center;color:#fff;font:italic 1.2rem var(--f)}
.ph-w{width:min(76%,330px);margin:1.4rem auto}.ph-w .ph{aspect-ratio:3/4;border-radius:999px 999px 6px 6px;outline:1px solid var(--gold);outline-offset:9px}
.scroll{font-size:.8rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}.scroll i{display:block;width:1px;height:40px;background:var(--gold);margin:.6rem auto 0;transform-origin:top;animation:drip 2s infinite}
@keyframes drip{0%{scale:1 0}60%{scale:1 1}100%{scale:1 1;opacity:0}}
.date{font:italic 300 clamp(1.5rem,7vw,2.1rem) var(--f);margin-bottom:2rem}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}.cd div{padding:1rem 0;border:1px solid var(--blush);border-radius:50% 50% 8px 8px / 36% 36% 8px 8px}
.cd b{display:block;font:300 clamp(2rem,10vw,3rem)/1 var(--f);font-variant-numeric:tabular-nums}.cd span{font-size:.75rem;color:var(--sage)}
.card{padding:2rem 1rem;border-top:1px solid var(--blush)}.card h3{font-size:2.1rem;font-style:italic}.card .t{color:var(--gold);letter-spacing:.1em}
.tl{text-align:left;border-left:1px solid var(--blush);margin-left:.5rem;padding-left:1.6rem}
.tl li{list-style:none;position:relative;padding-bottom:1.8rem}.tl li::before{content:"";position:absolute;left:calc(-1.6rem - 4px);top:.75rem;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.tl b{font:500 1.55rem var(--f)}.tl em{display:block;color:var(--sage);font-size:.95rem}
.dc{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.dc .ph{aspect-ratio:3/4;border-radius:999px 999px 6px 6px;margin-bottom:.8rem}.dc h3{font-size:1.7rem;font-style:italic}
.table{font:italic 300 clamp(3.2rem,17vw,5.2rem) var(--f);color:var(--gold)}
.gal{columns:2;gap:.6rem}.gal .ph{margin-bottom:.6rem;border-radius:4px}
.rv{opacity:0;translate:0 26px;transition:opacity 1.2s,translate 1.2s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;translate:0}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.petals i{position:absolute;top:-24px;width:11px;height:15px;background:var(--blush);border-radius:50% 0 50% 50%;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}10%{opacity:.8}100%{opacity:0;transform:translate3d(var(--x),105vh,0) rotate(540deg)}}
dialog{border:0;border-radius:14px;padding:1.6rem;width:min(92vw,460px);background:var(--bg);color:var(--ink);text-align:left;max-height:90svh}
dialog::backdrop{background:#3a2a3399}
label{display:block;font-size:.9rem;margin:.9rem 0 .25rem;color:var(--sage)}
input,select,textarea{width:100%;font:inherit;padding:.7rem .8rem;border:1px solid var(--blush);border-radius:8px;background:var(--card);color:inherit}
input[readonly]{background:transparent;border-style:dashed}
.gen{max-width:480px;margin:auto;padding:2rem 1.2rem;text-align:left}.gen .btn{margin-top:1rem}.lk{margin-top:.8rem;padding:.8rem;border:1px solid var(--blush);border-radius:8px;font-size:.85rem;word-break:break-all}
@media(min-width:800px){.gal{columns:3}section{padding:7rem 1.5rem}}
.brand{padding:2rem 1.5rem 3.5rem;max-width:420px;margin:auto}.brand b{display:block;font:500 1.15rem var(--f);letter-spacing:.35em;margin-top:.2rem}.brand span{display:block;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sage)}.brand p{font-size:.8rem;line-height:1.6;opacity:.65;margin-top:.7rem}
#w{background:#2a1d22;color:#fff}
#w .bg{position:absolute;inset:0;background:var(--i) center/cover,linear-gradient(160deg,#6b4f55,#2a1d22);animation:bgin 2.4s both,zoom 18s ease-out both}
@keyframes bgin{from{opacity:0}}@keyframes zoom{from{scale:1.12}}
#w .veil{position:absolute;inset:0;background:linear-gradient(180deg,#1c1217b3,#1c121766 42%,#1c1217d9)}
#w .frame{position:absolute;inset:max(14px,env(safe-area-inset-top)) 14px 14px;border:1px solid #ffffff55;pointer-events:none;animation:up 2s 1s both}
#w .c{z-index:1;color:#fff}#w h1{font-size:clamp(3.4rem,17vw,6rem);line-height:.95}#w h1 span{display:block}#w h1 em{display:block;font-size:.4em;color:#e6cf9f;margin:.15em 0}
#w .wd{font:400 .85rem var(--s);letter-spacing:.35em;text-transform:uppercase;color:#f1e3c8}#w .orn{color:#e6cf9f}#w .btn{color:#fff;border-color:#e6cf9f}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:1.8rem}.duo h3{font:italic 300 1.9rem var(--f)}.duo p{font-size:.9rem;opacity:.8}
@media(prefers-reduced-motion:reduce){*,::before{animation:none!important;transition-duration:.01ms!important}html{scroll-behavior:auto}.rv,.hero h1 span,.hero>*:not(h1),#w .c>*{opacity:1;translate:0;filter:none}.st{stroke-dashoffset:0}.petals{display:none}}
.guest .nm{display:block;margin-top:.9rem;font:italic 400 clamp(1.5rem,6.5vw,2rem)/1.2 var(--f);color:var(--gold)}
.guest .hi{display:block;font:italic 300 1.4rem var(--f);color:var(--gold);margin-bottom:.4rem}
</style></head>
<body class="lock">
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="bloom" viewBox="0 0 100 100"><g class="bl"><ellipse cx="50" cy="26" rx="12" ry="24"/><ellipse cx="50" cy="26" rx="12" ry="24" transform="rotate(45 50 50)"/><ellipse cx="50" cy="26" rx="12" ry="24" transform="rotate(90 50 50)"/><ellipse cx="50" cy="26" rx="12" ry="24" transform="rotate(135 50 50)"/><ellipse cx="50" cy="26" rx="12" ry="24" transform="rotate(180 50 50)"/><ellipse cx="50" cy="26" rx="12" ry="24" transform="rotate(225 50 50)"/><ellipse cx="50" cy="26" rx="12" ry="24" transform="rotate(270 50 50)"/><ellipse cx="50" cy="26" rx="12" ry="24" transform="rotate(315 50 50)"/></g><circle class="bl g" cx="50" cy="50" r="7"/></symbol>
<symbol id="garland" viewBox="0 0 300 300"><path class="st" pathLength="1" d="M0 20C90 20 150 60 170 150S230 270 300 280"/><path class="st" pathLength="1" d="M20 0C30 90 70 140 130 170"/>
<path class="lf" d="M60 38c-4-22 8-32 24-34-2 20-10 30-24 34zM110 52c2-20 16-26 32-24-6 18-16 24-32 24zM150 98c-14-12-12-26-2-38 12 12 12 26 2 38zM176 170c-4-18 4-30 20-36 4 18-4 30-20 36zM40 70c-18-8-20-22-14-36 16 8 20 22 14 36zM84 112c-16-6-20-20-14-34 14 8 18 20 14 34z"/>
<use href="#bloom" x="108" y="2" width="70" height="70"/><use href="#bloom" x="0" y="52" width="52" height="52"/><use href="#bloom" x="150" y="118" width="44" height="44"/></symbol>
</defs></svg>
<main id="w"></main><div id="inv" hidden></div><dialog id="dlg"></dialog>
<script>
// ===== CONTENU MODIFIABLE =====
const W={couple:{a:"Caleb",b:"Joyce",ini:"C & J",bioA:"Deux histoires, un seul chemin. Remplacez ce texte par quelques mots sur Caleb.",bioB:"Un regard, un sourire, une promesse. Remplacez ce texte par quelques mots sur Joyce."},date:"2027-06-12T10:00:00",
 T:{wt:"Bienvenue",msg:"Chers invités, votre présence donnera à cette journée toute sa lumière. Faites défiler pour découvrir les détails de notre célébration.",cT:"Les mariés",wx:"Nous nous marions, et nous serions heureux de partager ce jour avec vous.",open:"Découvrir l'invitation",
  inv:"Ont le plaisir de vous inviter à partager avec eux la célébration de leur mariage.",scroll:"Faites défiler",std:"Save the date",
  d:"jours",h:"heures",m:"minutes",s:"secondes",info:"Les lieux",prog:"Programme",dress:"Dress code",rsvp:"Confirmer ma présence",
  rbtn:"Je confirme ma présence",table:"Votre table",gal:"Galerie",send:"Envoyer",thanks:"Merci ! Votre réponse est enregistrée."},
 events:[{t:"Cérémonie",h:"10h00",p:"Église Saint-Joseph",a:"12 avenue des Roses, Kinshasa"},{t:"Réception",h:"14h00",p:"Salle Émeraude",a:"5 boulevard du Lac, Kinshasa"}],
 program:[["10h00","Cérémonie","Église Saint-Joseph","Échange des vœux"],["12h00","Cocktail","Jardin",""],["14h00","Réception","Salle Émeraude","Déjeuner et discours"],["18h00","Soirée dansante","Salle Émeraude",""]],
 dress:[["Madame","Robe élégante","dresscode-woman"],["Monsieur","Costume élégant","dresscode-man"]],gallery:4,
 brand:{name:"EC ÉVENT",tagline:"Invitations digitales & événementiel",text:"Nous créons des invitations digitales élégantes et organisons vos événements, du premier détail au jour J."}};

// ===== LISTE DES INVITÉS =====
// Le lien de chaque invité : https://mon-site.vercel.app/?invite=sebastien
// (la clé = ce qui suit ?invite= ; en minuscules, sans espace ni accent)
// Pour afficher aussi une table : marie: { nom: "Madame Marie", table: "08" }
const invites = {
  sebastien: "Couple Sébastien Mutuala",
  caleb: "Couple Caleb",
  jules: "Couple Jules"
};
const L={monsieur:'Monsieur',madame:'Madame',couple:'Couple',famille:'Famille',perso:''};
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=W.T,c=W.couple,d=new Date(W.date),R={};
// Lecture du paramètre ?invite= : seul le nom de CET invité est affiché, jamais la liste.
function fromPath(){var p=location.pathname.replace(/^\/+|\/+$/g,'');if(!p||/\./.test(p))return '';try{p=decodeURIComponent(p)}catch(e){}return p.split(/[-_]+/).filter(Boolean).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1)}).join(' ')}
const QS=location.search||(()=>{try{return decodeURIComponent(escape(atob(location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/'))))}catch(e){return ''}})();
const key=(new URLSearchParams(QS).get('invite')||'').toLowerCase();
const raw=Object.prototype.hasOwnProperty.call(invites,key)?invites[key]:null;
const U=new URLSearchParams(QS),free=(U.get('nom')||fromPath()).trim().slice(0,60);
const entry=raw===null?(free?{nom:free,table:(U.get('table')||'').slice(0,30)}:{nom:'Cher invité'}):(typeof raw==='string'?{nom:raw}:raw);
const m=entry.nom.match(/^(Couple|Monsieur|Madame|Famille)\s+(.+)$/i);
const G={name:m&&m[1].toLowerCase()!=='famille'?m[2]:entry.nom,table:entry.table||'',seats:entry.places||2};
const acc=Math.max(0,Math.min(20,parseInt(U.get('acc'))||0)),named=G.name!=='Cher invité';
const lab=m?m[1][0].toUpperCase()+m[1].slice(1).toLowerCase():'';
const shown=(lab&&G.name.toLowerCase().indexOf(lab.toLowerCase())!==0?lab+' ':'')+G.name;
page();
function page(){const fl=(cl,st)=>`<svg class="corner ${cl}" viewBox="0 0 300 300" aria-hidden="true"><use href="#garland"/></svg>`;
const sep='<div class="orn"><i></i></div>',f=o=>d.toLocaleDateString('fr-FR',o);
$('#w').innerHTML=`<div class="bg" style="--i:url(images/hero.jpg)"></div><div class="veil"></div><div class="frame"></div><div class="c"><div class="orn"><i></i></div><h1 aria-label="${E(c.a)} et ${E(c.b)}"><span>${E(c.a)}</span><em>&amp;</em><span>${E(c.b)}</span></h1><div class="wd">${f({day:'numeric'})} ${f({month:'long'})} ${f({year:'numeric'})}</div><p>${T.wx}</p><button class="btn pulse" id="o">${T.open}</button></div>`;
const names=s=>[...s].map((ch,i)=>`<span style="animation-delay:${(.3+i*.07).toFixed(2)}s">${ch===' '?'&nbsp;':E(ch)}</span>`).join('');
$('#inv').innerHTML=`<div class="petals" aria-hidden="true">${Array.from({length:9},(_,i)=>`<i style="left:${i*11+3}%;--x:${i%2?-40:50}px;animation-duration:${15+i*2}s;animation-delay:${i*1.7}s"></i>`).join('')}</div>
<header class="hero"><h1 aria-label="${c.a} et ${c.b}">${names(c.a+' & '+c.b)}</h1><p>${T.msg}</p><div class="scroll">${T.scroll}<i></i></div></header>
<section class="rv"><h2>${T.cT}</h2>${sep}<div class="ph-w"><div class="ph" style="--i:url(images/couple.jpg)" role="img" aria-label="Les mariés"></div></div><div class="duo"><div><h3>${E(c.a)}</h3><p>${E(c.bioA)}</p></div><div><h3>${E(c.b)}</h3><p>${E(c.bioB)}</p></div></div></section>
<section class="rv"><div class="guest"><b>Cher invité</b>${named?`<span class="nm">${E(shown)}</span>`:''}${acc?`<small>+ ${acc} accompagnant${acc>1?'s':''}</small>`:''}</div><div class="orn" style="margin-top:1.5rem"><i></i></div><p>${T.inv}</p></section>
<section class="rv"><svg class="sep" viewBox="0 0 100 100" aria-hidden="true"><use href="#bloom"/></svg><h2>${T.std}</h2>${sep}<div class="date">${f({weekday:'long'})} ${f({day:'numeric'})} ${f({month:'long'})} ${f({year:'numeric'})}</div>
<div class="cd">${['d','h','m','s'].map(k=>`<div><b data-k="${k}">0</b><span>${T[k]}</span></div>`).join('')}</div></section>
<section class="rv"><h2>${T.info}</h2>${sep}${W.events.map(e=>`<div class="card"><h3>${e.t}</h3><p class="t">${e.h}</p><p>${e.p}<br>${e.a}</p></div>`).join('')}</section>
<section class="rv"><h2>${T.prog}</h2>${sep}<ul class="tl">${W.program.map(p=>`<li><b>${p[0]} · ${p[1]}</b>${p[2]?`<em>${p[2]}</em>`:''}${p[3]?`<span>${p[3]}</span>`:''}</li>`).join('')}</ul></section>
<section class="rv"><h2>${T.dress}</h2>${sep}<div class="dc">${W.dress.map(x=>`<div><div class="ph" style="--i:url(images/${x[2]}.jpg)" role="img" aria-label="${x[0]}"></div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></section>
<section class="rv"><svg class="sep" viewBox="0 0 100 100" aria-hidden="true"><use href="#bloom"/></svg><h2>${T.rsvp}</h2>${sep}<button class="btn" id="r">${T.rbtn}</button></section>
${G.table?`<section class="rv"><h2>${T.table}</h2>${sep}<div class="table">${E(G.table)}</div></section>`:''}
<section class="rv"><h2>${T.gal}</h2>${sep}<div class="gal">${Array.from({length:W.gallery},(_,i)=>`<div class="ph" style="--i:url(images/gallery-0${i+1}.jpg);aspect-ratio:${i%3==1?'4/3':'3/4'}" role="img" aria-label="Photo ${i+1}"></div>`).join('')}</div></section>
<footer class="brand rv"><div class="orn"><i></i></div><b>${E(W.brand.name)}</b><span>${E(W.brand.tagline)}</span><p>${E(W.brand.text)}</p></footer>`;
$('#o').onclick=()=>{const w=$('#w');w.classList.add('out');$('#inv').hidden=false;scrollTo(0,0);requestAnimationFrame(()=>$('#inv').classList.add('go'));setTimeout(()=>{w.remove();document.body.classList.remove('lock')},1400)};
const tick=()=>{const s=Math.max(0,(d-Date.now())/1e3),v={d:s/86400,h:s%86400/3600,m:s%3600/60,s:s%60};for(const k in v)$(`[data-k=${k}]`).textContent=Math.floor(v[k])};tick();setInterval(tick,1000);
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&(e.target.classList.add('in'),io.unobserve(e.target))),{threshold:.15});document.querySelectorAll('.rv').forEach(x=>io.observe(x));

$('#r').onclick=()=>{const D=$('#dlg');D.innerHTML=`<h3 style="font-size:2rem">${T.rsvp}</h3><div id="fm"><label>Nom</label><input readonly value="${E(G.name+(lab?' ('+lab+')':''))}">
<label>Présence</label><select id="a"><option value="1">Oui, avec plaisir</option><option value="0" ${R.a===false?'selected':''}>Non, avec regret</option></select>
